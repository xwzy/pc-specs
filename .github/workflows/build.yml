name: Build

# 推到 main 时在 5 个原生 runner 上构建 GPUI 应用并打包：
#   - macOS  arm64        → .dmg
#   - Linux  amd64/arm64  → .tar.gz + .deb
#   - Windows amd64/arm64 → .zip
#
# 每个平台都在对应的原生 runner 上构建，不做交叉编译。产物以 artifact 形式上传；
# 推 `v*` tag 时，额外建一个 GitHub Release 并附带所有安装包。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支重复推送时取消旧 run，节省 ARM runner 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: macos-arm64
            runner: macos-14            # Apple Silicon
            os: macos
          - label: linux-amd64
            runner: ubuntu-22.04
            os: linux
          - label: linux-arm64
            runner: ubuntu-22.04-arm    # GitHub 托管的 ARM runner
            os: linux
          - label: windows-amd64
            runner: windows-latest
            os: windows
          - label: windows-arm64
            runner: windows-11-arm      # GitHub 托管的 Windows-on-ARM runner
            os: windows

    env:
      MATRIX_LABEL: ${{ matrix.platform.label }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GPUI 在 Linux 上需要 fontconfig / Wayland / xkbcommon / XCB 的开发包；
      # 运行时的 Vulkan 驱动由用户系统提供，编译不需要。
      - name: Install Linux deps
        if: matrix.platform.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev

      # ring（HTTPS 依赖）在 Windows ARM64 上必须用 clang 编译 C 代码。
      - name: Ensure clang on Windows ARM64
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress }
          clang --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.label }}

      - name: Build release binary
        run: cargo build --release --locked -p pc-specs

      - name: Package (macOS / Linux)
        if: matrix.platform.os != 'windows'
        run: scripts/package.sh "$MATRIX_LABEL"

      - name: Package (Windows)
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $stage = "dist/pc-specs-$version-$env:MATRIX_LABEL"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/pc-specs.exe $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/pc-specs-$version-$env:MATRIX_LABEL.zip" -Force
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-specs-${{ matrix.platform.label }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # 推 `v*` tag 时把所有平台的 artifact 汇总到一个 GitHub Release。
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.zip' \) \
            -exec cp {} release-files/ \;
          ls -la release-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
