name: Build

# 推到 main 时构建 6 个平台 × 架构组合的 Tauri 安装包：
#   - macOS  arm64 / amd64
#   - Linux  arm64 / amd64
#   - Windows arm64 / amd64
#
# 每个矩阵分支跑在 GitHub 官方提供的对应原生 runner 上，避免 cross-compile
# 时 webkit2gtk / WindowsSDK 的麻烦。所有产物都会以 artifact 形式上传到本次 run。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支重复推送时取消旧 run，节省 ARM runner 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ---- macOS ----
          - label: macos-arm64
            runner: macos-14            # Apple Silicon (M-series)
            target: aarch64-apple-darwin
            os: macos
          - label: macos-amd64
            runner: macos-13            # Intel
            target: x86_64-apple-darwin
            os: macos

          # ---- Linux ----
          - label: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - label: linux-arm64
            runner: ubuntu-22.04-arm    # GitHub-hosted ARM runner (公开免费)
            target: aarch64-unknown-linux-gnu
            os: linux

          # ---- Windows ----
          - label: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
          - label: windows-arm64
            runner: windows-11-arm      # GitHub-hosted Windows-on-ARM runner
            target: aarch64-pc-windows-msvc
            os: windows

    env:
      # 把矩阵字段提前展开成进程环境变量，避免在 run: 里直接做 ${{ ... }} 插值，
      # 同时方便后续 step 复用。
      MATRIX_LABEL: ${{ matrix.platform.label }}
      MATRIX_TARGET: ${{ matrix.platform.target }}
      MATRIX_OS: ${{ matrix.platform.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # --- Tauri 2 在 Linux 需要 webkit2gtk-4.1 + 一系列 GTK / 桌面集成依赖 ---
      - name: Install Linux deps
        if: matrix.platform.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json packageManager 字段保持一致
          version: 10.26.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 同一仓库不同 target 的产物互不复用
          key: ${{ matrix.platform.target }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        shell: bash
        env:
          # 关闭 dev-only 签名（CI 不持有签名密钥；如需启用，在仓库 secrets 里
          # 添加 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # 后再删除这两行 fallback）。
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target "$MATRIX_TARGET"

      # 不同平台 bundle 产物放在不同子目录 (dmg / deb / rpm / AppImage / msi /
      # exe / nsis)。这里用一个统一 glob 聚合所有可分发文件 + 裸可执行文件。
      - name: Collect bundle artifacts
        if: always()
        shell: bash
        run: |
          set -e
          OUT="dist-${MATRIX_LABEL}"
          mkdir -p "$OUT"
          BUNDLE_DIR="src-tauri/target/${MATRIX_TARGET}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" \
              \( -name '*.dmg' -o -name '*.app.tar.gz' \
                 -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
                 -o -name '*.msi' -o -name '*-setup.exe' \) \
              -type f -print -exec cp {} "$OUT/" \;
          fi
          BIN_DIR="src-tauri/target/${MATRIX_TARGET}/release"
          if [ "$MATRIX_OS" = "windows" ] && [ -f "$BIN_DIR/pc-specs.exe" ]; then
            cp "$BIN_DIR/pc-specs.exe" "$OUT/pc-specs-${MATRIX_LABEL}.exe"
          elif [ "$MATRIX_OS" != "windows" ] && [ -f "$BIN_DIR/pc-specs" ]; then
            cp "$BIN_DIR/pc-specs" "$OUT/pc-specs-${MATRIX_LABEL}"
          fi
          ls -la "$OUT" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-specs-${{ matrix.platform.label }}
          path: dist-${{ matrix.platform.label }}/*
          if-no-files-found: warn
          retention-days: 14
