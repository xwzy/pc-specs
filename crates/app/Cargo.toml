[package]
name = "pc-specs"
description = "Cross-platform PC configuration viewer and live monitor, built with GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pc-specs"
path = "src/main.rs"

# 两个发行版，开关一致地传给 core（详见 `crates/core/src/edition.rs`）：
# - `full`（默认）：自行发布的全功能版。
# - `appstore`：Mac App Store 版，构建方式 `cargo build --release --no-default-features --features appstore`。
[features]
default = ["full"]
full = ["pc-specs-core/full"]
appstore = ["pc-specs-core/appstore"]

[dependencies]
pc-specs-core = { path = "../core", default-features = false }
gpui-kit = "0.9.0"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
dirs = "7"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = "0.46"
auto-launch = "0.6"
flate2 = "1"
# 存储分析里「移到废纸篓 / 回收站」。
trash = "5"

[build-dependencies]
winresource = "0.1"

# GPUI 没有托盘 API。Linux 上用 tray-icon 的 ksni 后端（StatusNotifierItem，不依赖 GTK）。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# 监控大屏保持常亮时，收尾要给 caffeinate / systemd-inhibit 所在的进程组发信号。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSWorkspace", "NSAppearance", "NSStatusItem", "NSStatusBarButton", "NSView", "NSControl", "NSButton", "NSResponder", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSURL", "NSUserDefaults", "NSValue", "NSGeometry", "objc2-core-services"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# 只用来问一句「有没有托盘宿主」，ksni 和 GPUI 的 ashpd 本来就带着它。
zbus = "5"
