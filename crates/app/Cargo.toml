[package]
name = "pc-specs"
description = "Cross-platform PC configuration viewer and live monitor, built with GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pc-specs"
path = "src/main.rs"

[dependencies]
pc-specs-core = { path = "../core" }
gpui-kit = "0.9.0"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
dirs = "7"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = "0.46"
auto-launch = "0.6"
flate2 = "1"

[build-dependencies]
winresource = "0.1"

# GPUI 没有托盘 API。Linux 上用 tray-icon 的 ksni 后端（StatusNotifierItem，不依赖 GTK）。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# 监控大屏保持常亮时，收尾要给 caffeinate / systemd-inhibit 所在的进程组发信号。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# 只用来问一句「有没有托盘宿主」，ksni 和 GPUI 的 ashpd 本来就带着它。
zbus = "5"
