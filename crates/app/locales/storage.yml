_version: 2

# ---- 空间分析：收集箱 ----
sa_act_collect:
  en: "Add to collector"
  zh-CN: "加入收集箱"
sa_act_uncollect:
  en: "Remove from collector"
  zh-CN: "移出收集箱"
sa_collect_empty:
  en: "Collector: add the files and folders you want to clear, check the total, then move them all to the %{bin} in one go."
  zh-CN: "收集箱：把想清理的文件和文件夹加进来，核对总量后一次性移到%{bin}。"
sa_collect_inside:
  en: "“%{name}” is already part of “%{folder}” in the collector."
  zh-CN: "“%{name}”已经包含在收集箱里的“%{folder}”中了。"
sa_collect_more:
  en: "+%{n} more"
  zh-CN: "另有 %{n} 项"
sa_collect_total:
  en: "%{n} items · %{size}"
  zh-CN: "%{n} 项 · %{size}"
sa_collect_trash:
  en: "Move to %{bin}"
  zh-CN: "移到%{bin}"
sa_collect_clear:
  en: "Clear"
  zh-CN: "清空"
sa_collect_trash_title:
  en: "Move %{n} items to the %{bin}?"
  zh-CN: "把 %{n} 项移到%{bin}？"
sa_collect_trash_desc:
  en: "%{size} in %{files} files in total. They keep taking up space until you empty the %{bin}."
  zh-CN: "共 %{size}、%{files} 个文件。清空%{bin}之前它们仍占着磁盘，清空后才会释放空间。"
sa_collect_done:
  en: "Moved %{n} items (%{size}) to the %{bin}."
  zh-CN: "已把 %{n} 项（%{size}）移到%{bin}。"
sa_collect_partial:
  en: "Moved %{moved} of %{total} items (%{size}). “%{name}” failed: %{error}"
  zh-CN: "已移走 %{moved}/%{total} 项（%{size}）。“%{name}”失败：%{error}"

# ---- 空间分析：隐藏空间 ----
sa_hidden_title:
  en: "Hidden space: %{size}"
  zh-CN: "隐藏空间：%{size}"
sa_hidden_desc:
  en: "This much of the disk is in use but a file scan can't see it: folders this app isn't allowed to read, system snapshots and the file system's own bookkeeping."
  zh-CN: "磁盘上有这么多空间已被占用，却没法通过扫描文件看到：没有权限读取的文件夹、系统快照，以及文件系统自身的开销。"
sa_hidden_snapshots:
  en: " Time Machine local snapshots (%{n}) are part of it; macOS removes them by itself when it needs the room."
  zh-CN: " 其中包含 %{n} 个时间机器本地快照，系统在空间不足时会自动清理。"
sa_purgeable_title:
  en: "Purgeable: %{size}"
  zh-CN: "可清除空间：%{size}"
sa_purgeable_desc:
  en: "macOS frees this by itself when space runs low (caches, re-downloadable files). It is already counted in the map below."
  zh-CN: "系统在空间不足时会自动腾出这部分（缓存、可重新下载的内容），已经计入下方的统计。"
sa_purgeable_label:
  en: "Purgeable"
  zh-CN: "可清除空间"

# ---- 空间分析：旋转图 ----
sa_map_treemap:
  en: "Treemap"
  zh-CN: "树图"
sa_map_sunburst:
  en: "Sunburst"
  zh-CN: "旋转图"
sa_hint_rings:
  en: "Click a segment to select it, double-click a folder to open it, click the center to go back up, right-click for more actions."
  zh-CN: "单击弧形选中，双击文件夹进入，单击圆心返回上一级，右键查看更多操作。"

# ---- 空间分析：搜索与筛选 ----
sa_search:
  en: "Search by name…"
  zh-CN: "按名称搜索…"
sa_results:
  en: "Search results"
  zh-CN: "搜索结果"
sa_filter_size:
  en: "Size"
  zh-CN: "大小"
sa_filter_age:
  en: "Not modified for"
  zh-CN: "未修改"
sa_filter_any:
  en: "Any"
  zh-CN: "不限"
sa_age_days:
  en: "≥ %{n} days"
  zh-CN: "≥ %{n} 天"
sa_age_year:
  en: "≥ 1 year"
  zh-CN: "≥ 1 年"
sa_collect_results:
  en: "Add all to collector"
  zh-CN: "全部加入收集箱"
sa_collect_added:
  en: "Added %{n} items to the collector."
  zh-CN: "已把 %{n} 项加入收集箱。"
sa_clear_filters:
  en: "Clear filters"
  zh-CN: "清除筛选"

