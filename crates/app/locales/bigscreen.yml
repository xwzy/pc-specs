bs_title:
  en: "Monitoring Wall"
  zh-CN: "监控大屏"
bs_description:
  en: "A live status board you can put on a second monitor. Pick a theme and arrange the widgets; it fits landscape, portrait and ultrawide screens."
  zh-CN: "把实时状态铺满另一块显示器的看板。选主题、排组件，横屏、竖屏、超宽屏都能自动适配。"
