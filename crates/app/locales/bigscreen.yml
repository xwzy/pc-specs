  en: "Auto"
  zh-CN: "自动"
bs_display_n:
  en: "Display %{n}"
  zh-CN: "显示器 %{n}"
bs_display_primary:
  en: "Main"
  zh-CN: "主屏"
bs_display_hint:
  en: "Auto picks a second monitor when there is one, otherwise the main display. Changing it reopens a wall that is already open."
  zh-CN: "自动：有副屏就用副屏，只有一块屏时用主屏。更改后，已经打开的大屏会按新设置重新打开。"
bs_display_missing:
  en: "The selected display is not connected right now, so the wall picks one automatically."
  zh-CN: "选中的显示器当前没有连接，大屏暂时自动选择。"
bs_display_none:
  en: "No display detected."
  zh-CN: "没有检测到显示器。"
bs_fullscreen_hint:
  en: "Turn off to show the wall in an ordinary window that you can move and resize."
  zh-CN: "关闭后以普通窗口显示，可以自己拖动位置、调整大小。"
bs_open_on_launch:
  en: "Open when the app starts"
  zh-CN: "启动应用时自动打开"
bs_open_on_launch_hint:
  en: "Combine it with launch at login to turn a spare monitor into a dashboard."
  zh-CN: "配合开机自启，副屏一开机就是看板。"
bs_keep_awake:
  en: "Keep the screen awake"
  zh-CN: "保持屏幕常亮"
bs_keep_awake_hint:
  en: "Stops the display from sleeping and the system from idling while the wall is open."
  zh-CN: "大屏开着的时候，显示器不熄屏、系统不进入休眠。"
