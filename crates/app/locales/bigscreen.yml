  zh-CN: "放大 / 缩小内容"
bs_key_header:
  en: "Show / hide the header"
  zh-CN: "显示 / 隐藏顶栏"
bs_key_settings:
  en: "Open wall settings"
  zh-CN: "打开大屏设置"
bs_keys_hint:
  en: "Move the mouse over the wall to bring up the toolbar. Cmd / Ctrl + Shift + B opens the wall from anywhere in the app."
  zh-CN: "鼠标在大屏上一动，就会浮出工具条。在应用里的任何地方按 Cmd / Ctrl + Shift + B 都能打开大屏。"
