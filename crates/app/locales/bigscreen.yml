  zh-CN: "内存占用"
bs_widgets:
  en: "Widgets"
  zh-CN: "组件"
bs_widgets_hint:
  en: "Widgets are placed in list order. Width and height are relative: a 2×1 widget gets twice the area of a 1×1."
  zh-CN: "按列表从上到下的顺序摆放。宽、高是相对大小：2×1 的组件面积是 1×1 的两倍。"
