  zh-CN: "布局方案"
bs_presets_hint:
  en: "A preset rewrites the widget list below. Theme and display stay as they are."
  zh-CN: "选择方案会重排下面的组件列表，主题和显示器保持不变。"
bs_hide_missing:
  en: "Hide hardware this computer does not have"
  zh-CN: "隐藏本机没有的硬件"
bs_hide_missing_hint:
  en: "Skips widgets such as battery or GPU on machines without them, so the others get the space."
  zh-CN: "没有电池、独立显卡等硬件时不占位，空间让给其他组件。"
bs_per_core:
  en: "Show per-core CPU usage"
  zh-CN: "CPU 组件显示每个核心"
