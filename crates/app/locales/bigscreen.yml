  en: "Preview"
  zh-CN: "预览"
bs_preview_hint:
  en: "The preview is laid out like a real screen and scaled down, so it shows exactly what the wall will look like. Switch the shape to see how it adapts."
  zh-CN: "预览按真实大屏的版式排好再等比缩小，所见即所得。切换屏幕形状，就能看到横屏、竖屏、超宽屏下的自适应效果。"
