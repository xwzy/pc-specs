  en: "Powers the 1 h to 30 d views in the monitor panels. Readings are averaged into 1-minute and 30-minute slots, compressed, and capped at about 0.5 MB, so it never keeps growing. Turn off to keep history in memory only."
  zh-CN: "面板里 1 小时到 30 天的走势就是从这里来的。读数按 1 分钟、30 分钟取平均后压缩保存，总量固定在 0.5 MB 左右，不会越积越多。关闭后只在运行期间保留。"
