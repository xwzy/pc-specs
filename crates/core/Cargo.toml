[package]
name = "pc-specs-core"
description = "Hardware information collection, live sampling, export and local HTTP API for PC Specs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "pc_specs_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 跨平台 CPU / 内存 / 磁盘（含 IO）/ 网卡 / 传感器 / GPU（含实时占用与显存）。
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component", "gpu"] }
os_info = "3"
whoami = "2"
sys-locale = "0.3"
battery = "0.7"
parking_lot = "0.13"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 查询公网 IP 的 HTTPS 客户端（rustls，不依赖系统 OpenSSL）。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 本地 HTTP 采集服务（局域网拉取本机指标）。只开必要 features 控制体积。
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "limit", "timeout"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
] }
